name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
  pull_request:
    branches:
      - "*"
      - "*/*"
      - "**"

jobs:
  build-windows-release:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Install CMake
        uses: lukka/get-cmake@v3.23.2

      - name: Generate build files
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF .. -G "Visual Studio 16 2019" -A Win32
          cmake --build . --config Release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: crashdetect-win-release
          path: build/Release/crashdetect.dll

  build-linux-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Build Linux compatible with old GLIBC
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            debian:10 \
            bash -lc '
              export DEBIAN_FRONTEND=noninteractive

              printf "deb [trusted=yes] http://archive.debian.org/debian buster main\n" > /etc/apt/sources.list
              printf "deb [trusted=yes] http://archive.debian.org/debian-security buster/updates main\n" >> /etc/apt/sources.list

              apt-get -o Acquire::Check-Valid-Until=false update

              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                gcc-multilib \
                g++-multilib \
                make \
                git

              rm -rf build

              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=OFF \
                -DCMAKE_C_FLAGS=-m32 \
                -DCMAKE_CXX_FLAGS=-m32

              cmake --build build --config Release --parallel 2
            '

      - name: Verify Linux plugin
        run: |
          file build/crashdetect.so
          strings build/crashdetect.so | grep -E "GLIBC_[0-9]" | sort -Vu

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: crashdetect-linux-glibc228-i386
          path: build/crashdetect.so